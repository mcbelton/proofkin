name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install Linux build dependencies
        run: sudo apt-get update && sudo apt-get install -y pkg-config libssl-dev libdbus-1-dev
      # fmt, clippy and tests, each result matched to a claim in evidence/claims.json.
      - name: Evidence (gates, tests, claims)
        timeout-minutes: 20
        run: python3 scripts/evidence.py
      - name: Show test failures
        if: failure() || cancelled()
        run: tail -n 120 target/evidence/logs/test.log || true
      - name: Upload evidence report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: evidence-report
          path: target/evidence/
      - name: Evidence summary
        if: always()
        run: test -f target/evidence/report.md && cat target/evidence/report.md >> "$GITHUB_STEP_SUMMARY"
