name: release

# Builds Proofkin for Windows, Linux and macOS and publishes the archives as a
# GitHub release. Triggered by pushing a version tag, e.g. `git tag v0.1.0 && git push --tags`.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: windows-11-arm
            target: aarch64-pc-windows-msvc
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y pkg-config libssl-dev libdbus-1-dev

      - name: Build
        env:
          PROOFKIN_RELEASE_REPO: ${{ github.repository }}
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $name = "proofkin-${{ matrix.target }}"
          New-Item -ItemType Directory $name | Out-Null
          Copy-Item target/${{ matrix.target }}/release/proofkin.exe, README.md, LICENSE-MIT, LICENSE-APACHE $name
          Compress-Archive -Path "$name/*" -DestinationPath "$name.zip"

      - name: Package (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          name="proofkin-${{ matrix.target }}"
          mkdir "$name"
          cp target/${{ matrix.target }}/release/proofkin README.md LICENSE-MIT LICENSE-APACHE "$name/"
          tar -czf "$name.tar.gz" -C "$name" .

      - uses: actions/upload-artifact@v7
        with:
          name: proofkin-${{ matrix.target }}
          path: proofkin-${{ matrix.target }}.*

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Write SHA256SUMS
        run: |
          (cd dist && sha256sum proofkin-*) > dist/SHA256SUMS
          sha256sum install.ps1 install.sh >> dist/SHA256SUMS
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" dist/* install.ps1 install.sh \
            --title "Proofkin ${{ github.ref_name }}" --generate-notes
