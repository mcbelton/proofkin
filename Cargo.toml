[package]
name = "proofkin"
version = "0.17.0"
edition = "2024"
description = "Peer-to-peer LLM agents: delegate coding tasks across agents over the internet using the GitHub Copilot, Claude Agent and Codex SDKs"
license = "MIT OR Apache-2.0"
repository = "https://github.com/mcbelton/proofkin"

[dependencies]
anyhow = "1.0.104"
async-trait = "0.1.92"
axum = { version = "0.8.9", default-features = false, features = ["http1", "json", "query", "tokio", "matched-path"] }
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
clap = { version = "4.6.7", features = ["derive", "env"] }
data-encoding = "2.11.1"
futures-util = "0.3.34"
github-copilot-sdk = { version = "1.0.34", default-features = false, features = ["runtime"] }
iroh = "1.4.1"
keyring = "4.2.0"
pulldown-cmark = { version = "0.13.6", default-features = false, features = ["html"] }
regex = { version = "1.13.2", default-features = false, features = ["std", "unicode-perl", "unicode-case"] }
rpassword = "7.5.5"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
tokio = { version = "1.54.1", features = ["full"] }
tokio-stream = { version = "0.1.19", features = ["sync"] }

[target.'cfg(unix)'.dependencies]
# Signals a check's process group directly (an external `kill` varies by distro).
libc = "0.2"

[dev-dependencies]
tempfile = "3.27.0"

[patch.crates-io]
# Same as iroh 1.4.1 without the cdylib crate type; see vendor/iroh/VENDORED.md.
iroh = { path = "vendor/iroh" }

