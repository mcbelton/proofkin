[package]
name = "proofkin"
version = "0.29.0"
edition = "2024"
description = "Peer-to-peer LLM agents: delegate coding tasks across agents over the internet using the GitHub Copilot, Claude Agent and Codex SDKs"
license = "MIT OR Apache-2.0"
repository = "https://github.com/mcbelton/proofkin"

[dependencies]
anyhow = "1.0.104"
async-trait = "0.1.92"
axum = { version = "0.8.9", default-features = false, features = ["http1", "json", "query", "tokio", "matched-path"] }
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
clap = { version = "4.6.7", features = ["derive", "env"] }
data-encoding = "2.11.1"
futures-util = "0.3.34"
github-copilot-sdk = { version = "1.0.34", default-features = false, features = ["runtime"] }
iroh = "1.4.1"
keyring = "4.2.0"
pulldown-cmark = { version = "0.13.6", default-features = false, features = ["html"] }
# Reads a Word document's text (src/docx.rs); both are already in the tree.
quick-xml = { version = "0.42.0", default-features = false }
regex = { version = "1.13.2", default-features = false, features = ["std", "unicode-perl", "unicode-case"] }
# Built the way iroh builds it (rustls with a preconfigured ring provider), so no second TLS stack.
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider"] }
rpassword = "7.5.5"
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
tokio = { version = "1.54.1", features = ["full"] }
tokio-stream = { version = "0.1.19", features = ["sync"] }
uuid = { version = "1.29.2", default-features = false, features = ["v4"] }
webpki-roots = "1.0.12"
zip = { version = "9.5.1", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[target.'cfg(unix)'.dependencies]
# Signals a check's process group directly (an external `kill` varies by distro).
libc = "0.2"

[dev-dependencies]
tempfile = "3.27.0"
# Paused time, for tests of waits that count only awake time (src/awake.rs).
tokio = { version = "1.54.1", features = ["test-util"] }

[patch.crates-io]
# Same as iroh 1.4.1 without the cdylib crate type; see vendor/iroh/VENDORED.md.
iroh = { path = "vendor/iroh" }

